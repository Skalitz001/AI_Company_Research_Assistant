services:
  - type: web
    name: company-research-assistant
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    envVars:
      # Required provider credentials. Enter these in Render's environment UI.
      - key: SERPER_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_DEFAULT_MODEL
        sync: false
      # Optional settings. The application supplies defaults when omitted.
      - key: OPENROUTER_MODEL_SUGGESTIONS
        value: "openai/gpt-oss-20b:free,nvidia/nemotron-3-super-120b-a12b:free,google/gemma-4-26b-a4b-it:free,openrouter/free"
      - key: OPENROUTER_APP_URL
        sync: false
      - key: CRAWLER_USER_AGENT
        value: CompanyResearchAssistant/1.0 (+research crawler)
      - key: DISCORD_ENABLED
        value: "false"
